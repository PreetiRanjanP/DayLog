<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DayLog – Daily Task &amp; Study Tracker</title>
<style>
/* ========== CSS variables & reset ========== */
:root {
  --bg: #f6f5f1;
  --card: #ffffff;
  --card-border: #e2e2e6;
  --text: #1a1a1e;
  --text2: #555560;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-light: #eef2ff;
  --status-todo: #8a8a93;
  --status-prog: #d97706;
  --status-done: #16a34a;
  --status-block: #dc2626;
  --danger: #dc2626;
  --danger-hover: #b91c1c;
  --radius: 13px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media(prefers-color-scheme:dark){
  :root {
    --bg: #121316;
    --card: #1b1c21;
    --card-border: #2a2b31;
    --text: #e4e4e8;
    --text2: #9a9aa4;
    --accent-light: #1e1e30;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  min-height:100vh;padding-bottom:var(--safe-b);
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
input,select,textarea,button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer}

/* ========== Responsive Gradient ASCII Background ========== */
.ascii-bg {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.ascii-bg canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ========== Layout ========== */
.wrap{max-width:860px;margin:0 auto;padding:0 16px;position:relative;z-index:2}

/* ========== Header ========== */
header{
  background:rgba(255, 255, 255, 0.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--card-border);
  position:sticky;top:0;z-index:100;
}
@media(prefers-color-scheme:dark){
  header{background:rgba(27, 28, 33, 0.88)}
}
.header-inner{
  display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap;
}
.logo{font-size:1.35rem;font-weight:800;white-space:nowrap}
.logo .day{color:var(--text)}
.logo .log{color:var(--accent)}
.search-box{
  margin-left:auto;position:relative;min-width:180px;flex:1;max-width:320px;
}
.search-box input{
  width:100%;padding:8px 12px 8px 34px;border:1px solid var(--card-border);
  border-radius:8px;background:var(--bg);outline:none;font-size:.9rem;
}
.search-box input:focus{border-color:var(--accent)}
.search-box .icon-search{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;opacity:.45;pointer-events:none;
}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  max-height:400px;overflow-y:auto;display:none;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
}
.search-results.open{display:block}
.sr-msg{padding:14px;text-align:center;color:var(--text2);font-size:.9rem}
.sr-item{
  padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--card-border);
  font-size:.88rem;
}
.sr-item:last-child{border:none}
.sr-item:hover{background:var(--accent-light)}
.sr-item .sr-date{font-size:.78rem;color:var(--text2);margin-bottom:2px}
.sr-item .sr-type{
  display:inline-block;font-size:.7rem;font-weight:600;text-transform:uppercase;
  padding:1px 6px;border-radius:4px;background:var(--accent-light);color:var(--accent);
  margin-right:6px;
}
mark{background:#fde68a;color:#000;border-radius:2px;padding:0 1px}
@media(prefers-color-scheme:dark){mark{background:#854d0e;color:#fde68a}}

/* ========== Date bar ========== */
.date-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 0;flex-wrap:wrap;
}
.date-bar button{
  padding:6px 12px;border:1px solid var(--card-border);border-radius:8px;
  background:var(--card);font-size:.85rem;
}
.date-bar button:hover{border-color:var(--accent);color:var(--accent)}
.date-bar input[type=date]{
  padding:6px 10px;border:1px solid var(--card-border);border-radius:8px;
  background:var(--card);font-size:.95rem;font-weight:600;
}

/* ========== Tabs ========== */
.tabs{
  display:flex;gap:6px;padding:0 0 12px;
}
.tab-btn{
  padding:7px 18px;border:none;border-radius:20px;
  background:var(--card);font-size:.88rem;font-weight:600;
  border:1px solid var(--card-border);
}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ========== Cards ========== */
.card{
  background:rgba(255, 255, 255, 0.90);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.03);
}
@media(prefers-color-scheme:dark){
  .card{
    background:rgba(27, 28, 33, 0.88);
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
  }
}

/* ========== Stats ========== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-card{text-align:center;padding:14px 8px}
.stat-card .val{font-size:1.6rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:.78rem;color:var(--text2);margin-top:2px}
.stat-card .bar-wrap{
  height:6px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden;
}
.stat-card .bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}

/* ========== Task slot ========== */
.slot{
  display:grid;grid-template-columns:92px 1fr auto;gap:0 14px;
  padding:14px 16px;border-left:4px solid var(--status-todo);position:relative;
}
.slot.s-prog{border-left-color:var(--status-prog)}
.slot.s-done{border-left-color:var(--status-done)}
.slot.s-block{border-left-color:var(--status-block)}
.slot-time{
  font-size:.82rem;font-weight:600;color:var(--text2);padding-top:2px;
}
.slot-time .now-tag{
  display:inline-block;font-size:.65rem;font-weight:700;color:#fff;
  background:var(--accent);border-radius:4px;padding:1px 5px;margin-left:4px;
  vertical-align:middle;
}
.slot-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-body input[type=text],.slot-body textarea,.slot-body select{
  width:100%;padding:7px 10px;border:1px solid var(--card-border);
  border-radius:8px;background:var(--bg);outline:none;font-size:.88rem;
}
.slot-body textarea{resize:vertical;min-height:52px}
.slot-body input:focus,.slot-body textarea:focus,.slot-body select:focus{border-color:var(--accent)}
.slot-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot-row select{max-width:150px}
.slot-row .progress-wrap{flex:1;display:flex;align-items:center;gap:6px;min-width:120px}
.slot-row .progress-wrap input[type=range]{flex:1;accent-color:var(--accent)}
.slot-row .progress-wrap span{font-size:.82rem;min-width:34px;text-align:right;color:var(--text2)}
.slot-actions{display:flex;align-items:flex-start;padding-top:2px}
.btn-clear{
  padding:5px 10px;border:1px solid var(--card-border);border-radius:8px;
  background:var(--card);font-size:.78rem;color:var(--text2);
}
.btn-clear:hover{border-color:var(--danger);color:var(--danger)}

/* ========== Study tab ========== */
.study-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.study-form .full{grid-column:1/-1}
.study-form input,.study-form textarea{
  width:100%;padding:8px 10px;border:1px solid var(--card-border);
  border-radius:8px;background:var(--bg);outline:none;font-size:.88rem;
}
.study-form textarea{resize:vertical;min-height:72px}
.study-form input:focus,.study-form textarea:focus{border-color:var(--accent)}
.study-actions{
  grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:4px;
}
.btn-primary{
  padding:8px 20px;border:none;border-radius:8px;
  background:var(--accent);color:#fff;font-weight:600;font-size:.88rem;
}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{
  padding:8px 16px;border:1px solid var(--card-border);border-radius:8px;
  background:var(--card);font-size:.88rem;
}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{
  padding:5px 12px;border:1px solid var(--card-border);border-radius:8px;
  background:var(--card);font-size:.82rem;color:var(--danger);
}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}

.study-list{margin-top:14px}
.study-entry{
  padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
  border-bottom:1px solid var(--card-border);
}
.study-entry:last-child{border:none}
.study-info{flex:1;min-width:0}
.study-info h4{font-size:.95rem;margin-bottom:2px}
.study-info .topic-line{font-size:.84rem;color:var(--text2)}
.study-info .notes-preview{
  font-size:.82rem;color:var(--text2);margin-top:4px;
  white-space:pre-wrap;word-break:break-word;
}
.study-info .mins-badge{
  display:inline-block;font-size:.72rem;font-weight:600;
  padding:2px 7px;border-radius:4px;background:var(--accent-light);color:var(--accent);
  margin-left:6px;
}
.study-btns{display:flex;gap:6px;flex-shrink:0}

/* ========== Toast ========== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#1a1a1e;color:#fff;padding:10px 20px;border-radius:10px;
  font-size:.88rem;z-index:9999;opacity:0;pointer-events:none;
  transition:opacity .25s;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;pointer-events:auto}

/* ========== Loading ========== */
.loading-overlay{
  display:flex;align-items:center;justify-content:center;
  padding:40px;color:var(--text2);font-size:.95rem;
}

/* ========== Responsive ========== */
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .slot{grid-template-columns:1fr;gap:8px}
  .slot-actions{justify-content:flex-end}
  .study-form{grid-template-columns:1fr}
  .header-inner{gap:8px}
  .search-box{min-width:0;max-width:none;flex-basis:100%;order:3}
}
</style>
</head>
<body>

<!-- Responsive Gradient ASCII Background -->
<div id="gradientAsciiBg" class="ascii-bg" aria-hidden="true">
  <canvas id="asciiCanvas"></canvas>
</div>

<!-- Header -->
<header>
  <div class="wrap header-inner">
    <div class="logo"><span class="day">Day</span><span class="log">Log</span></div>
    <div class="search-box">
      <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search all dates…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
</header>

<!-- Date bar -->
<div class="wrap">
  <div class="date-bar">
    <button id="prevDay">← Prev</button>
    <input type="date" id="datePicker">
    <button id="nextDay">Next →</button>
    <button id="todayBtn">Today</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="plan">Plan</button>
    <button class="tab-btn" data-tab="study">Study</button>
  </div>
</div>

<!-- Plan tab -->
<div class="wrap" id="panelPlan">
  <!-- Stats -->
  <div class="stats" id="statsBar">
    <div class="card stat-card"><div class="val" id="statPlanned">0</div><div class="lbl">Planned</div></div>
    <div class="card stat-card"><div class="val" id="statDone">0</div><div class="lbl">Done</div></div>
    <div class="card stat-card"><div class="val" id="statProg">0</div><div class="lbl">In Progress</div></div>
    <div class="card stat-card">
      <div class="val" id="statAvg">0%</div><div class="lbl">Avg Progress</div>
      <div class="bar-wrap"><div class="bar-fill" id="statBar" style="width:0%"></div></div>
    </div>
  </div>
  <!-- Slots container -->
  <div id="slotsContainer"></div>
</div>

<!-- Study tab -->
<div class="wrap" id="panelStudy" style="display:none">
  <div class="card">
    <div class="study-form" id="studyForm">
      <input type="text" id="sfSubject" placeholder="Subject" maxlength="100">
      <input type="text" id="sfTopic" placeholder="Topic" maxlength="200">
      <textarea class="full" id="sfNotes" placeholder="Key notes…" maxlength="10000"></textarea>
      <input type="number" id="sfMins" placeholder="Minutes studied" min="0">
      <div class="study-actions">
        <button class="btn-secondary" id="sfCancel" style="display:none">Cancel</button>
        <button class="btn-primary" id="sfSubmit">Add entry</button>
      </div>
    </div>
  </div>
  <div id="studyList" class="study-list"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ========== Helpers ========== */
function esc(s){
  if(typeof s!=='string') return '';
  const d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function formatDate(d){return d.toISOString().slice(0,10)}
function today(){return formatDate(new Date())}

/* ========== State ========== */
let currentDate = today();
let activeTab = 'plan';
let appKey = '';
let taskData = {};  // slot -> data
let studyData = []; // array
let editingStudyId = null;

const SLOTS = [];
for (let startMin = 6 * 60; startMin < 21 * 60; startMin += 90) {
  const endMin = startMin + 90;
  const sh = String(Math.floor(startMin / 60)).padStart(2, '0');
  const sm = String(startMin % 60).padStart(2, '0');
  const eh = String(Math.floor(endMin / 60)).padStart(2, '0');
  const em = String(endMin % 60).padStart(2, '0');
  const slotKey = sh + ':' + sm;
  const label = sh + ':' + sm + ' – ' + eh + ':' + em;
  SLOTS.push({ slot: slotKey, label, startMin, endMin });
}

const STATUS_MAP = {
  todo:{label:'Not started',cls:''},
  prog:{label:'In progress',cls:'s-prog'},
  done:{label:'Done',cls:'s-done'},
  block:{label:'Blocked',cls:'s-block'},
};

/* ========== DOM refs ========== */
const $=s=>document.querySelector(s);
const datePicker = $('#datePicker');
const slotsContainer = $('#slotsContainer');
const studyList = $('#studyList');
const searchInput = $('#searchInput');
const searchResults = $('#searchResults');
const toast = $('#toast');

/* ========== Toast ========== */
let toastTimer;
function showToast(msg, dur=3500){
  toast.textContent=msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove('show'), dur);
}

/* ========== LocalStorage key ========== */
function loadKey(){
  try{ appKey=localStorage.getItem('daylog_key')||''; }catch(e){}
}
function saveKey(k){
  try{ localStorage.setItem('daylog_key',k); }catch(e){}
  appKey=k;
}
loadKey();

/* ========== Fetch wrapper with auth retry ========== */
async function api(url, opts={}){
  opts.headers = opts.headers||{};
  if(appKey) opts.headers['x-app-key']=appKey;
  if(opts.body && typeof opts.body==='object'){
    opts.headers['Content-Type']='application/json';
    opts.body=JSON.stringify(opts.body);
  }
  let res=await fetch(url,opts);
  if(res.status===401){
    const k=prompt('Enter your DayLog access key:');
    if(k){
      saveKey(k);
      opts.headers['x-app-key']=k;
      if(opts.body && typeof opts.body==='string') { /* body already stringified */ }
      res=await fetch(url,opts);
    }
  }
  if(!res.ok){
    const j=await res.json().catch(()=>({error:'Unknown error'}));
    throw new Error(j.error||'Request failed');
  }
  return res.json();
}

/* ========== Date navigation ========== */
function setDate(d){
  currentDate=d;
  datePicker.value=d;
  loadData();
}

datePicker.addEventListener('change',()=>setDate(datePicker.value));
$('#prevDay').addEventListener('click',()=>{
  const d=new Date(currentDate+'T12:00:00');d.setDate(d.getDate()-1);setDate(formatDate(d));
});
$('#nextDay').addEventListener('click',()=>{
  const d=new Date(currentDate+'T12:00:00');d.setDate(d.getDate()+1);setDate(formatDate(d));
});
$('#todayBtn').addEventListener('click',()=>setDate(today()));

/* ========== Tabs ========== */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab=btn.dataset.tab;
    $('#panelPlan').style.display = activeTab==='plan'?'':'none';
    $('#panelStudy').style.display = activeTab==='study'?'':'none';
  });
});

/* ========== Load data ========== */
async function loadData(){
  slotsContainer.innerHTML='<div class="loading-overlay">Loading…</div>';
  studyList.innerHTML='<div class="loading-overlay">Loading…</div>';
  try{
    const [tasks, study] = await Promise.all([
      api('/api/tasks?date='+currentDate),
      api('/api/study?date='+currentDate),
    ]);
    taskData={};
    tasks.forEach(t=>{ taskData[t.slot]=t; });
    studyData=study;
    renderSlots();
    renderStudy();
    updateStats();
  }catch(e){
    showToast('Load failed: '+e.message);
    slotsContainer.innerHTML='';
    studyList.innerHTML='';
  }
}

/* ========== Current slot detection ========== */
function currentSlotKey(){
  if(currentDate!==today()) return null;
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  for(let i=0;i<SLOTS.length;i++){
    if(mins>=SLOTS[i].startMin && mins<SLOTS[i].endMin) return SLOTS[i].slot;
  }
  return null;
}

/* ========== Render slots ========== */
function renderSlots(){
  const nowSlot=currentSlotKey();
  slotsContainer.innerHTML='';
  SLOTS.forEach(s=>{
    const d=taskData[s.slot]||{};
    const status=d.status||'todo';
    const cls=STATUS_MAP[status].cls;
    const isNow=s.slot===nowSlot;
    const progress=d.progress||0;

    const div=document.createElement('div');
    div.className='card slot'+(cls?' '+cls:'');
    div.innerHTML=`
      <div class="slot-time">${esc(s.label)}${isNow?'<span class="now-tag">NOW</span>':''}</div>
      <div class="slot-body">
        <input type="text" placeholder="What's planned?" value="${esc(d.title||'')}" data-field="title" maxlength="200">
        <div class="slot-row">
          <select data-field="status">
            ${Object.entries(STATUS_MAP).map(([k,v])=>`<option value="${k}"${k===status?' selected':''}>${esc(v.label)}</option>`).join('')}
          </select>
          <div class="progress-wrap">
            <input type="range" min="0" max="100" step="5" value="${progress}" data-field="progress">
            <span>${progress}%</span>
          </div>
        </div>
        <textarea placeholder="What did you actually do?" data-field="report" maxlength="4000">${esc(d.report||'')}</textarea>
      </div>
      <div class="slot-actions">
        <button class="btn-clear">Clear</button>
      </div>
    `;
    // Auto-save debounce
    let timer;
    function scheduleSave(){
      clearTimeout(timer);
      timer=setTimeout(()=>saveSlot(s.slot, div), 500);
    }
    div.querySelector('[data-field=title]').addEventListener('input', scheduleSave);
    div.querySelector('[data-field=report]').addEventListener('input', scheduleSave);
    div.querySelector('[data-field=progress]').addEventListener('input', e=>{
      e.target.nextElementSibling.textContent=e.target.value+'%';
      scheduleSave();
    });
    div.querySelector('[data-field=status]').addEventListener('change', e=>{
      if(e.target.value==='done'){
        const slider=div.querySelector('[data-field=progress]');
        slider.value=100;
        slider.nextElementSibling.textContent='100%';
      }
      // Update border colour immediately
      div.className='card slot'+(STATUS_MAP[e.target.value].cls?' '+STATUS_MAP[e.target.value].cls:'');
      scheduleSave();
    });
    div.querySelector('.btn-clear').addEventListener('click',()=>clearSlot(s.slot, div));

    slotsContainer.appendChild(div);
  });
}

async function saveSlot(slot, div){
  const title=div.querySelector('[data-field=title]').value;
  const status=div.querySelector('[data-field=status]').value;
  const progress=parseInt(div.querySelector('[data-field=progress]').value,10);
  const report=div.querySelector('[data-field=report]').value;

  // Skip save if all fields are empty
  if(!title.trim() && !report.trim() && status==='todo' && progress===0) return;

  taskData[slot]={date:currentDate,slot,title,status,progress,report};
  updateStats();

  try{
    await api('/api/tasks',{method:'POST',body:{date:currentDate,slot,title,status,progress,report}});
  }catch(e){
    showToast('Save failed: '+e.message);
  }
}

async function clearSlot(slot, div){
  div.querySelector('[data-field=title]').value='';
  div.querySelector('[data-field=status]').value='todo';
  const slider=div.querySelector('[data-field=progress]');
  slider.value=0; slider.nextElementSibling.textContent='0%';
  div.querySelector('[data-field=report]').value='';
  div.className='card slot';

  delete taskData[slot];
  updateStats();

  try{
    await api('/api/tasks?date='+currentDate+'&slot='+encodeURIComponent(slot),{method:'DELETE'});
  }catch(e){
    showToast('Clear failed: '+e.message);
  }
}

/* ========== Stats ========== */
function updateStats(){
  const entries=Object.values(taskData);
  const planned=entries.length;
  const done=entries.filter(e=>e.status==='done').length;
  const prog=entries.filter(e=>e.status==='prog').length;
  const avg=planned?Math.round(entries.reduce((s,e)=>s+(e.progress||0),0)/planned):0;

  $('#statPlanned').textContent=planned;
  $('#statDone').textContent=done;
  $('#statProg').textContent=prog;
  $('#statAvg').textContent=avg+'%';
  $('#statBar').style.width=avg+'%';
}

/* ========== Study ========== */
function renderStudy(){
  if(!studyData.length){
    studyList.innerHTML='<div class="card" style="text-align:center;color:var(--text2);padding:24px">No study entries for this date.</div>';
    return;
  }
  studyList.innerHTML='';
  studyData.forEach(e=>{
    const div=document.createElement('div');
    div.className='card study-entry';
    div.innerHTML=`
      <div class="study-info">
        <h4>${esc(e.subject)}${e.mins?'<span class="mins-badge">'+esc(String(e.mins))+' min</span>':''}</h4>
        <div class="topic-line">${esc(e.topic)}</div>
        ${e.notes?'<div class="notes-preview">'+esc(e.notes)+'</div>':''}
      </div>
      <div class="study-btns">
        <button class="btn-secondary btn-edit">Edit</button>
        <button class="btn-danger btn-del">Delete</button>
      </div>
    `;
    div.querySelector('.btn-edit').addEventListener('click',()=>startEditStudy(e));
    div.querySelector('.btn-del').addEventListener('click',()=>deleteStudy(e._id));
    studyList.appendChild(div);
  });
}

// Form submit
$('#sfSubmit').addEventListener('click', submitStudy);
$('#sfCancel').addEventListener('click', cancelEditStudy);

async function submitStudy(){
  const subject=$('#sfSubject').value.trim();
  const topic=$('#sfTopic').value.trim();
  const notes=$('#sfNotes').value.trim();
  const mins=parseInt($('#sfMins').value,10)||0;

  if(!subject){showToast('Subject is required');return;}

  try{
    if(editingStudyId){
      await api('/api/study?id='+editingStudyId,{method:'PUT',body:{subject,topic,notes,mins}});
    }else{
      await api('/api/study',{method:'POST',body:{date:currentDate,subject,topic,notes,mins}});
    }
    cancelEditStudy();
    loadData();
  }catch(e){
    showToast('Save failed: '+e.message);
  }
}

function startEditStudy(entry){
  editingStudyId=entry._id;
  $('#sfSubject').value=entry.subject||'';
  $('#sfTopic').value=entry.topic||'';
  $('#sfNotes').value=entry.notes||'';
  $('#sfMins').value=entry.mins||'';
  $('#sfSubmit').textContent='Update entry';
  $('#sfCancel').style.display='';
  $('#sfSubject').focus();
}

function cancelEditStudy(){
  editingStudyId=null;
  $('#sfSubject').value='';
  $('#sfTopic').value='';
  $('#sfNotes').value='';
  $('#sfMins').value='';
  $('#sfSubmit').textContent='Add entry';
  $('#sfCancel').style.display='none';
}

async function deleteStudy(id){
  if(!confirm('Delete this study entry?')) return;
  try{
    await api('/api/study?id='+id,{method:'DELETE'});
    loadData();
  }catch(e){
    showToast('Delete failed: '+e.message);
  }
}

/* ========== Search ========== */
let searchTimer;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  const q=searchInput.value.trim();
  if(!q){searchResults.classList.remove('open');return;}
  searchResults.innerHTML='<div class="sr-msg">Searching…</div>';
  searchResults.classList.add('open');
  searchTimer=setTimeout(()=>runSearch(q),300);
});
searchInput.addEventListener('keydown',e=>{if(e.key==='Escape'){searchInput.value='';searchResults.classList.remove('open');}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))searchResults.classList.remove('open');});

async function runSearch(q){
  try{
    const data=await api('/api/search?q='+encodeURIComponent(q));
    const all=[];

    // Escape for regex highlight
    const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    function hl(str){return esc(str||'').replace(re,'<mark>$1</mark>');}

    data.tasks.forEach(t=>{
      all.push({
        date:t.date,
        tab:'plan',
        type:'Task '+t.slot,
        html: hl(t.title)+(t.report?' — '+hl(t.report):''),
      });
    });
    data.study.forEach(s=>{
      all.push({
        date:s.date,
        tab:'study',
        type:'Study',
        html: hl(s.subject)+' / '+hl(s.topic)+(s.notes?' — '+hl(s.notes):''),
      });
    });

    if(!all.length){
      searchResults.innerHTML='<div class="sr-msg">Nothing found</div>';
      return;
    }
    searchResults.innerHTML='';
    all.forEach(r=>{
      const div=document.createElement('div');
      div.className='sr-item';
      div.innerHTML=`<div class="sr-date">${esc(r.date)}</div><span class="sr-type">${esc(r.type)}</span>${r.html}`;
      div.addEventListener('click',()=>{
        searchInput.value='';
        searchResults.classList.remove('open');
        // Switch tab
        document.querySelectorAll('.tab-btn').forEach(b=>{
          b.classList.toggle('active',b.dataset.tab===r.tab);
        });
        activeTab=r.tab;
        $('#panelPlan').style.display=r.tab==='plan'?'':'none';
        $('#panelStudy').style.display=r.tab==='study'?'':'none';
        setDate(r.date);
      });
      searchResults.appendChild(div);
    });
  }catch(e){
    searchResults.innerHTML='<div class="sr-msg">Search failed</div>';
  }
}

/* ========== Responsive GradientASCII Engine ========== */
function initGradientASCII(container, canvas, customOptions) {
  const gl = canvas.getContext('webgl2', {
    alpha: true,
    premultipliedAlpha: true,
    antialias: false,
    depth: false,
    stencil: false
  });
  if (!gl) {
    console.warn('WebGL2 not supported; GradientASCII background disabled.');
    return { setLightMode: function(){} };
  }

  const MAX_COLORS = 8;
  const MAX_CLICKS = 4;
  const MAX_TRAIL = 24;
  const CLICK_LIFE = 1.2;
  const TRAIL_LIFE = 0.7;
  const TRAIL_STEP = 0.015;
  const INTRO_SECONDS = 2.4;
  const ATLAS_CELL_W = 60;
  const ATLAS_CELL_H = 100;
  const ATLAS_COLUMNS = 16;
  const FONT_SCALE = 0.78;
  const DEFAULT_COLORS = ['#1e3fd8', '#f6f8ff', '#a5d8ff', '#38bdf8'];
  const DEFAULT_CHARACTERS = ' =+xX0S8#@';
  const DEFAULT_FONT = '"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
  const SHAPES = { horizon: 0, pinch: 1, rise: 2, eclipse: 3 };
  const CLICK_EFFECTS = { none: 0, wave: 1, burst: 2 };

  const VERTEX = `#version 300 es
out vec2 vUv;
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

  const COMMON = `
float hash12(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
`;

  const FIELD = `#version 300 es
precision highp float;
precision highp int;
uniform float uAspect;
uniform float uTime;
uniform int uShape;
uniform vec3 uRamp[8];
uniform int uCount;
uniform float uScale;
uniform float uSoftness;
uniform float uFlow;
uniform vec2 uSeed;
uniform vec4 uTrail[24];
uniform float uRadius;
uniform vec4 uClicks[4];
uniform int uClickEffect;
uniform float uIntro;
uniform float uFrame;
in vec2 vUv;
layout(location = 0) out vec4 outColor;
layout(location = 1) out vec4 outAux;
${COMMON}
vec2 hash22(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.103, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.xx + q.yz) * q.zy) * 2.0 - 1.0;
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  float a = dot(hash22(i), f);
  float b = dot(hash22(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash22(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash22(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return 0.5 + 0.5 * mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

vec3 labToRgb(vec3 lab) {
  float l = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
  float m = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
  float s = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
  l = l * l * l;
  m = m * m * m;
  s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
  );
}

vec3 encode(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

vec3 horizon(vec2 p, float time, out float order) {
  float span = 0.5 * max(uAspect, 1.0);
  float x = p.x / span;
  float arch = -0.17 - 0.2 * x * x + 0.02 * sin(time * 0.6);
  float soft = mix(0.05, 0.22, uSoftness);
  float edge = p.y - arch;
  float rim = 0.38 * smoothstep(-soft, 0.42, edge);
  vec2 sun = vec2(0.08 * sin(time * 0.31) * span, 0.58);
  float spread = length((p - sun) / vec2(0.95 * span, 0.75));
  float sky = mix(0.55, 1.0, smoothstep(0.2, 0.95, spread));
  order = clamp(edge * 1.3, 0.0, 1.0);
  return vec3(rim, sky, smoothstep(0.18, 0.62, edge));
}

vec3 pinch(vec2 p, float time, out float order) {
  float span = 0.5 * max(uAspect, 0.75);
  float x = p.x / span;
  float sway = 0.02 * sin(x * 1.7 + time * 0.55);
  float breathe = 1.0 + 0.06 * sin(time * 0.8);
  float width = (0.13 + 0.22 * x * x) * breathe * mix(0.85, 1.2, uSoftness);
  float y = abs(p.y - sway) / width;
  float t = exp(-pow(y, 2.2)) * (0.42 + 0.58 * exp(-x * x * 1.8));
  order = clamp(abs(p.y - sway) * 2.4 + abs(x) * 0.3, 0.0, 1.0);
  return vec3(t, t, 0.0);
}

vec3 rise(vec2 p, float time, out float order) {
  float wide = max(uAspect, 0.9);
  vec2 center = vec2(0.05 * sin(time * 0.45) * wide, -0.7);
  vec2 radius = vec2(0.82 * wide, 0.64 * (1.0 + 0.04 * sin(time * 0.8)));
  float d = length((p - center) / radius);
  float soft = mix(0.6, 1.15, uSoftness);
  float t = clamp(pow(clamp(1.0 - d, 0.0, 1.0), soft) * 1.35, 0.0, 1.0);
  order = clamp((d - 0.2) * 1.3, 0.0, 1.0);
  return vec3(t, t, 0.0);
}

vec3 eclipse(vec2 p, float time, out float order) {
  float fit = min(1.0, uAspect * 1.25);
  float r = 0.23 * fit * (1.0 + 0.015 * sin(time * 0.9));
  float angle = atan(p.y, p.x);
  float rays = noise(vec2(cos(angle), sin(angle)) * 2.2 + time * 0.08) * 0.8 + 0.6;
  float d = length(p) - r;
  float reach = mix(0.07, 0.15, uSoftness) * rays * fit;
  float t = smoothstep(-0.006, 0.006 + 0.02 * uSoftness, d) * exp(-max(d, 0.0) / reach);
  order = clamp(d * 2.0, 0.0, 1.0);
  return vec3(t, t, 0.0);
}

vec4 tone(float t) {
  float x = smoothstep(0.3, 1.0, t) * float(uCount - 1);
  int index = int(floor(x));
  return vec4(mix(uRamp[index], uRamp[min(index + 1, uCount - 1)], fract(x)), smoothstep(0.0, 0.38, t));
}

void main() {
  vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
  float time = uTime;
  vec2 q = p / uScale;
  vec2 warp = vec2(
    noise(q * 1.6 + uSeed + vec2(0.0, time * 0.3)),
    noise(q * 1.6 + uSeed.yx + vec2(4.3, -time * 0.24))
  ) - 0.5;
  q += warp * uFlow * (uShape == 3 ? 0.04 : 0.18);
  float order = 0.0;
  vec3 shape;
  if (uShape == 0) shape = horizon(q, time, order);
  else if (uShape == 1) shape = pinch(q, time, order);
  else if (uShape == 2) shape = rise(q, time, order);
  else shape = eclipse(q, time, order);

  float reveal = clamp((uIntro * 1.45 - order) / 0.45, 0.0, 1.0);
  reveal = reveal * reveal * (3.0 - 2.0 * reveal);

  float scramble = 0.0;
  for (int i = 0; i < 24; i++) {
    vec4 point = uTrail[i];
    if (point.z <= 0.0) continue;
    vec2 d = p - point.xy;
    scramble = max(scramble, point.z * exp(-dot(d, d) / (uRadius * uRadius)));
  }
  for (int i = 0; i < 4; i++) {
    vec4 c = uClicks[i];
    if (c.w <= 0.0) continue;
    float d = length(p - c.xy);
    if (uClickEffect == 1) {
      scramble = max(scramble, exp(-pow((d - c.z * 0.75) / 0.06, 2.0)) * c.w);
    } else if (uClickEffect == 2) {
      float size = 0.08 + 0.22 * (1.0 - exp(-c.z * 5.0));
      scramble = max(scramble, (1.0 - smoothstep(size * 0.6, size, d)) * c.w);
    }
  }
  vec2 t = clamp(shape.xy * mix(0.7, 1.0, reveal), 0.0, 1.0);
  vec4 mixed = mix(tone(t.x), tone(t.y), shape.z);
  vec3 color = encode(labToRgb(mixed.rgb));
  float alpha = mixed.a * reveal;
  float dither = (hash12(gl_FragCoord.xy + uFrame * 13.7) - 0.5) / 255.0;
  outColor = clamp(vec4(color * alpha + dither, alpha + dither), 0.0, 1.0);
  outAux = vec4(reveal, scramble, 0.0, 1.0);
}`;

  const GLYPHS = `
uniform sampler2D uField;
uniform sampler2D uAux;
uniform sampler2D uAtlas;
uniform vec2 uResolution;
uniform vec2 uCell;
uniform vec2 uOffset;
uniform vec2 uAtlasGrid;
uniform float uCount;
uniform float uDensity;
uniform float uOpacity;
uniform float uFlicker;
uniform float uDepth;
uniform float uGlyphTime;
uniform float uSeedValue;
uniform float uLight;
${COMMON}
float sampleGlyph(float index, vec2 local, vec2 coord, float soft) {
  float column = mod(index, uAtlasGrid.x);
  float row = floor(index / uAtlasGrid.x);
  vec2 atlasUv = vec2((column + local.x) / uAtlasGrid.x, (row + 1.0 - local.y) / uAtlasGrid.y);
  vec2 continuous = coord / uAtlasGrid;
  float scale = exp2(soft);
  return textureGrad(uAtlas, atlasUv, dFdx(continuous) * scale, dFdy(continuous) * scale).a;
}

vec4 glyphAt(vec2 px) {
  vec2 coord = (px - uOffset) / uCell;
  vec2 cell = floor(coord);
  vec2 local = coord - cell;
  vec2 uv = clamp(((cell + 0.5) * uCell + uOffset) / uResolution, vec2(0.0), vec2(1.0));
  vec4 field = texture(uField, uv);
  vec4 aux = texture(uAux, uv);
  vec3 visible = uLight > 0.5 ? field.rgb + (1.0 - field.a) : field.rgb;
  float luma = dot(visible, vec3(0.2126, 0.7152, 0.0722));
  float value = uLight > 0.5 ? clamp((1.0 - luma) * 1.5, 0.0, 1.0) : luma;
  float pick = hash12(cell + uSeedValue * 7.31);
  float level = hash12(cell * 1.73 + 4.1 + uSeedValue);
  float tick = floor(uGlyphTime * 9.0 + level * 9.0);
  float wobble = (hash12(cell * 2.31 + tick * 17.7) - 0.5) * uFlicker * 0.4 + (level - 0.5) * 0.1;
  float tone = clamp(pow(value, 0.75) + wobble, 0.0, 1.0);
  float index = floor(tone * (uCount - 1.0) + 0.5);
  float decode = max(aux.g, 1.0 - aux.r);
  if (decode > 0.02) {
    float frame = floor(uGlyphTime * 20.0);
    if (hash12(cell * 3.7 + frame * 5.3) < decode * 1.25) index = 1.0 + floor(hash12(cell + frame * 1.37) * (uCount - 1.0));
  }
  float present = step(pick, uDensity * mix(1.0, 0.3 + tone * 1.1, 0.55));
  float cutoff = smoothstep(0.03, 0.1, value);
  float focus = step(hash12(cell * 0.71 + 9.2 + uSeedValue), uDepth);
  float coverage = sampleGlyph(index, local, coord, focus * 1.2);
  float alpha = uOpacity * present * cutoff * coverage * mix(1.0, 0.35 + 0.65 * level, 0.55) * (1.0 - focus * 0.5);
  if (uLight < 0.5) {
    vec3 light = field.rgb * 0.55 + vec3(0.03) * field.a;
    return vec4(light * alpha, 0.6 * field.a * alpha);
  }
  vec3 ink = visible * 0.8;
  return vec4(ink * alpha, alpha);
}
`;

  const HALO = `#version 300 es
precision highp float;
uniform float uDownscale;
in vec2 vUv;
out vec4 outColor;
${GLYPHS}
void main() {
  outColor = glyphAt(gl_FragCoord.xy * uDownscale);
}`;

  const BLUR = `#version 300 es
precision highp float;
uniform sampler2D uSource;
uniform vec2 uStep;
in vec2 vUv;
out vec4 outColor;
void main() {
  vec4 sum = texture(uSource, vUv) * 0.2270270270;
  sum += texture(uSource, vUv + uStep * 1.3846153846) * 0.3162162162;
  sum += texture(uSource, vUv - uStep * 1.3846153846) * 0.3162162162;
  sum += texture(uSource, vUv + uStep * 3.2307692308) * 0.0702702703;
  sum += texture(uSource, vUv - uStep * 3.2307692308) * 0.0702702703;
  outColor = sum;
}`;

  const COMPOSITE = `#version 300 es
precision highp float;
uniform sampler2D uHalo;
uniform float uGlow;
uniform float uGradient;
uniform float uGrain;
uniform float uFrame;
in vec2 vUv;
out vec4 outColor;
${GLYPHS}
void main() {
  vec4 base = texture(uField, vUv) * uGradient;
  vec4 glyph = glyphAt(gl_FragCoord.xy);
  vec4 halo = texture(uHalo, vUv) * uGlow;
  vec4 color;
  if (uLight < 0.5) {
    color = base + glyph + halo;
  } else {
    color = glyph + base * (1.0 - glyph.a);
    color += halo * 0.6 * (1.0 - color.a);
  }
  float grain = (hash12(gl_FragCoord.xy + uFrame * vec2(17.0, 59.0)) + hash12(gl_FragCoord.xy * 1.31 + uFrame * 7.0) - 1.0) * uGrain;
  float body = clamp(color.a, 0.0, 1.0);
  color.rgb += grain * (0.25 + body) * 0.5;
  color.a = clamp(color.a, 0.0, 1.0);
  color.rgb = clamp(color.rgb, 0.0, color.a);
  outColor = color;
}`;

  const clampVal = (v, min, max) => Math.min(max, Math.max(min, v));
  const toLinear = (v) => (v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  const toLab = ([r, g, b]) => {
    const lr = toLinear(r), lg = toLinear(g), lb = toLinear(b);
    const l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb);
    const m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb);
    const s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb);
    return [
      0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s
    ];
  };

  const compileShader = (type, source) => {
    const s = gl.createShader(type);
    if (!s) return null;
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (gl.getShaderParameter(s, gl.COMPILE_STATUS)) return s;
    gl.deleteShader(s);
    return null;
  };

  const linkProg = (fragSrc) => {
    const v = compileShader(gl.VERTEX_SHADER, VERTEX);
    const f = compileShader(gl.FRAGMENT_SHADER, fragSrc);
    const prog = gl.createProgram();
    if (!v || !f || !prog) return null;
    gl.attachShader(prog, v);
    gl.attachShader(prog, f);
    gl.linkProgram(prog);
    gl.deleteShader(v);
    gl.deleteShader(f);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      gl.deleteProgram(prog);
      return null;
    }
    const uniforms = {};
    const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < count; i++) {
      const info = gl.getActiveUniform(prog, i);
      if (!info) continue;
      const name = info.name.replace(/\[0\]$/, '');
      uniforms[name] = gl.getUniformLocation(prog, name);
    }
    return { program: prog, uniforms };
  };

  const createFboTarget = (count) => {
    const textures = Array.from({ length: count }, () => {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return tex;
    });
    return { textures, framebuffer: gl.createFramebuffer(), width: 0, height: 0 };
  };

  const sizeFboTarget = (target, width, height) => {
    if (target.width === width && target.height === height) return;
    target.width = width;
    target.height = height;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.framebuffer);
    target.textures.forEach((tex, i) => {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, tex, 0);
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  };

  const buildGlyphAtlas = (characters, fontFamily) => {
    const list = [...new Set([...characters].filter(c => c !== '\n' && c !== '\r'))];
    if (!list.length) list.push(' ');
    const font = `300 ${Math.round(ATLAS_CELL_H * FONT_SCALE)}px ${fontFamily}`;
    const columns = Math.min(ATLAS_COLUMNS, list.length);
    const rows = Math.ceil(list.length / columns);
    const cvs = document.createElement('canvas');
    cvs.width = ATLAS_CELL_W * columns;
    cvs.height = ATLAS_CELL_H * rows;
    const ctx = cvs.getContext('2d');
    if (ctx) {
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      list.forEach((char, index) => {
        const column = index % columns;
        const row = Math.floor(index / columns);
        ctx.fillText(char, column * ATLAS_CELL_W + ATLAS_CELL_W / 2, row * ATLAS_CELL_H + ATLAS_CELL_H / 2 + 3);
      });
    }
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, cvs);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return { texture, count: list.length, grid: [columns, rows] };
  };

  const field = linkProg(FIELD);
  const halo = linkProg(HALO);
  const blur = linkProg(BLUR);
  const composite = linkProg(COMPOSITE);
  if (!field || !halo || !blur || !composite) {
    console.warn('Failed to compile GradientASCII shaders.');
    return { setLightMode: function(){} };
  }

  const vao = gl.createVertexArray();
  const fieldTarget = createFboTarget(2);
  const haloA = createFboTarget(1);
  const haloB = createFboTarget(1);

  const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  const colorCache = new Map();
  const parseColor = (val) => {
    const key = String(val);
    const cached = colorCache.get(key);
    if (cached) return cached;
    let rgb = [0, 0, 0];
    if (probe) {
      probe.clearRect(0, 0, 1, 1);
      probe.fillStyle = '#000000';
      probe.fillStyle = key;
      probe.fillRect(0, 0, 1, 1);
      const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
      rgb = [r / 255, g / 255, b / 255];
    }
    colorCache.set(key, rgb);
    return rgb;
  };

  const opts = customOptions || {};
  const isDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const palette = (opts.colors && opts.colors.length ? opts.colors : DEFAULT_COLORS).slice(0, MAX_COLORS);
  const settings = {
    colors: palette.length > 1 ? palette : [palette[0], palette[0]],
    shape: SHAPES[opts.shape] ?? 0,
    characters: opts.characters || DEFAULT_CHARACTERS,
    cellSize: clampVal(opts.cellSize || 18, 6, 64),
    density: clampVal(opts.density !== undefined ? opts.density : 0.8, 0, 1),
    glyphOpacity: clampVal(opts.glyphOpacity || 0.85, 0, 1),
    glow: clampVal(opts.glow !== undefined ? opts.glow : 0.25, 0, 2),
    depthOfField: clampVal(opts.depthOfField || 0, 0, 1),
    flicker: clampVal(opts.flicker || 0.2, 0, 1),
    softness: clampVal(opts.softness || 0.5, 0, 1),
    scale: clampVal(opts.scale || 1, 0.4, 2.5),
    flow: clampVal(opts.flow || 0.5, 0, 2),
    speed: Math.max(0, opts.speed !== undefined ? opts.speed : 0.85),
    gradientOpacity: clampVal(opts.gradientOpacity || 0.9, 0, 1),
    grain: clampVal(opts.grain || 0.08, 0, 0.4),
    variation: Math.max(0, opts.variation || 0),
    mouseInteraction: opts.mouseInteraction !== undefined ? opts.mouseInteraction : true,
    scrambleRadius: clampVal(opts.scrambleRadius || 0.1, 0.02, 0.4),
    clickEffect: CLICK_EFFECTS[opts.clickEffect] ?? 1,
    intro: opts.intro !== undefined ? opts.intro : true,
    lightMode: opts.lightMode !== undefined ? opts.lightMode : !isDarkMode,
    fontFamily: opts.fontFamily || DEFAULT_FONT,
    dpr: opts.dpr
  };

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const view = { width: 1, height: 1, ratio: 1 };
  const ramp = new Float32Array(MAX_COLORS * 3);
  const clickData = new Float32Array(MAX_CLICKS * 4);
  const clicks = [];
  const trailData = new Float32Array(MAX_TRAIL * 4);
  const trail = [];
  const pointer = { x: 0, y: 0, inside: false };
  let atlas = null;
  let atlasKey = '';
  let paletteKey = '';
  let time = 0;
  let glyphTime = 0;
  let introClock = settings.intro && !reduce ? 0 : 1;
  let frameSeed = 0;
  let grainClock = 0;
  let raf = 0;
  let last = 0;
  let visible = true;
  let disposed = false;

  const syncAtlas = () => {
    const key = `${settings.fontFamily}|${settings.characters}`;
    if (key === atlasKey && atlas) return;
    atlasKey = key;
    if (atlas) gl.deleteTexture(atlas.texture);
    atlas = buildGlyphAtlas(settings.characters, settings.fontFamily);
    document.fonts?.load?.(`300 64px ${settings.fontFamily}`, settings.characters).then(
      () => {
        if (disposed || atlasKey !== key) return;
        if (atlas) gl.deleteTexture(atlas.texture);
        atlas = buildGlyphAtlas(settings.characters, settings.fontFamily);
        draw();
      },
      () => {}
    );
  };

  const syncPalette = () => {
    const key = settings.colors.join(',');
    if (key === paletteKey) return;
    paletteKey = key;
    settings.colors.forEach((color, i) => ramp.set(toLab(parseColor(color)), i * 3));
  };

  const bindGlyphs = (prog, width, height) => {
    if (!atlas) return;
    const u = prog.uniforms;
    const cellH = settings.cellSize * view.ratio;
    const cellW = cellH * (ATLAS_CELL_W / ATLAS_CELL_H);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, fieldTarget.textures[0]);
    gl.uniform1i(u.uField, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fieldTarget.textures[1]);
    gl.uniform1i(u.uAux, 1);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, atlas.texture);
    gl.uniform1i(u.uAtlas, 2);
    gl.uniform2f(u.uResolution, width, height);
    gl.uniform2f(u.uCell, cellW, cellH);
    gl.uniform2f(
      u.uOffset,
      (width - Math.ceil(width / cellW) * cellW) / 2,
      (height - Math.ceil(height / cellH) * cellH) / 2
    );
    gl.uniform2f(u.uAtlasGrid, atlas.grid[0], atlas.grid[1]);
    gl.uniform1f(u.uCount, atlas.count);
    gl.uniform1f(u.uDensity, settings.density);
    gl.uniform1f(u.uOpacity, settings.glyphOpacity);
    gl.uniform1f(u.uFlicker, reduce ? 0 : settings.flicker);
    gl.uniform1f(u.uDepth, settings.depthOfField);
    gl.uniform1f(u.uGlyphTime, glyphTime);
    gl.uniform1f(u.uSeedValue, settings.variation);
    gl.uniform1f(u.uLight, settings.lightMode ? 1 : 0);
  };

  const draw = () => {
    const aspect = view.width / view.height;
    syncAtlas();
    syncPalette();
    gl.bindVertexArray(vao);
    gl.disable(gl.BLEND);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fieldTarget.framebuffer);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.viewport(0, 0, fieldTarget.width, fieldTarget.height);
    gl.useProgram(field.program);
    const fu = field.uniforms;
    gl.uniform1f(fu.uAspect, aspect);
    gl.uniform1f(fu.uTime, time);
    gl.uniform1i(fu.uShape, settings.shape);
    gl.uniform3fv(fu.uRamp, ramp);
    gl.uniform1i(fu.uCount, settings.colors.length);
    gl.uniform1f(fu.uScale, settings.scale);
    gl.uniform1f(fu.uSoftness, settings.softness);
    gl.uniform1f(fu.uFlow, settings.flow);
    gl.uniform2f(fu.uSeed, settings.variation * 3.17, settings.variation * 1.91);
    gl.uniform4fv(fu.uTrail, trailData);
    gl.uniform1f(fu.uRadius, settings.scrambleRadius);
    gl.uniform4fv(fu.uClicks, clickData);
    gl.uniform1i(fu.uClickEffect, settings.clickEffect);
    gl.uniform1f(fu.uIntro, introClock);
    gl.uniform1f(fu.uFrame, frameSeed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const glowing = settings.glow > 0.001;
    if (glowing) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, haloA.framebuffer);
      gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      gl.viewport(0, 0, haloA.width, haloA.height);
      gl.useProgram(halo.program);
      bindGlyphs(halo, canvas.width, canvas.height);
      gl.uniform1f(halo.uniforms.uDownscale, canvas.width / haloA.width);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.useProgram(blur.program);
      gl.activeTexture(gl.TEXTURE0);
      gl.uniform1i(blur.uniforms.uSource, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, haloB.framebuffer);
      gl.bindTexture(gl.TEXTURE_2D, haloA.textures[0]);
      gl.uniform2f(blur.uniforms.uStep, 1 / haloA.width, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, haloA.framebuffer);
      gl.bindTexture(gl.TEXTURE_2D, haloB.textures[0]);
      gl.uniform2f(blur.uniforms.uStep, 0, 1 / haloA.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(composite.program);
    bindGlyphs(composite, canvas.width, canvas.height);
    const cu = composite.uniforms;
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, haloA.textures[0]);
    gl.uniform1i(cu.uHalo, 3);
    gl.uniform1f(cu.uGlow, glowing ? settings.glow : 0);
    gl.uniform1f(cu.uGradient, settings.gradientOpacity);
    gl.uniform1f(cu.uGrain, settings.grain);
    gl.uniform1f(cu.uFrame, frameSeed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };

  const resize = () => {
    view.width = Math.max(1, container.clientWidth || window.innerWidth);
    view.height = Math.max(1, container.clientHeight || window.innerHeight);
    view.ratio = Math.min(settings.dpr || window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(view.width * view.ratio));
    canvas.height = Math.max(1, Math.round(view.height * view.ratio));
    sizeFboTarget(
      fieldTarget,
      Math.max(1, Math.round(canvas.width / 2)),
      Math.max(1, Math.round(canvas.height / 2))
    );
    const haloWidth = Math.max(1, Math.round(canvas.width / 4));
    const haloHeight = Math.max(1, Math.round(canvas.height / 4));
    sizeFboTarget(haloA, haloWidth, haloHeight);
    sizeFboTarget(haloB, haloWidth, haloHeight);
    draw();
    wake();
  };

  const updateInput = (dt) => {
    trail.forEach(point => { point.age += dt; });
    while (trail.length && trail[trail.length - 1].age > TRAIL_LIFE) trail.pop();
    for (let i = 0; i < MAX_TRAIL; i++) {
      const point = trail[i];
      if (!point) {
        trailData[i * 4 + 2] = 0;
        continue;
      }
      const k = 1 - point.age / TRAIL_LIFE;
      trailData.set([point.x, point.y, k * k, 0], i * 4);
    }
    clicks.forEach(click => { click.age += dt; });
    while (clicks.length && clicks[clicks.length - 1].age > CLICK_LIFE) clicks.pop();
    for (let i = 0; i < MAX_CLICKS; i++) {
      const click = clicks[i];
      if (!click) {
        clickData[i * 4 + 3] = 0;
        continue;
      }
      const k = click.age / CLICK_LIFE;
      const envelope = Math.min(1, click.age / 0.08) * (1 - k) * (1 - k);
      clickData.set([click.x, click.y, click.age, envelope], i * 4);
    }
  };

  const frame = (now) => {
    raf = 0;
    if (disposed || !visible || document.hidden) return;
    const dt = last ? clampVal((now - last) / 1000, 0.001, 0.05) : 1 / 60;
    last = now;
    if (!reduce) {
      time += dt * settings.speed * 0.5;
      glyphTime += dt * Math.max(settings.speed, 0.15);
    }
    if (introClock < 1) introClock = Math.min(1, introClock + dt / INTRO_SECONDS);
    grainClock += dt;
    if (!reduce && grainClock > 1 / 24) {
      grainClock = 0;
      frameSeed = (frameSeed + 1) % 97;
    }
    updateInput(dt);
    draw();
    const busy = !reduce || introClock < 1 || clicks.length > 0 || trail.length > 0;
    if (busy) raf = requestAnimationFrame(frame);
    else last = 0;
  };

  function wake() {
    if (!raf && !disposed && visible && !document.hidden) raf = requestAnimationFrame(frame);
  }

  const locate = (event) => {
    const rect = container.getBoundingClientRect();
    const x = (event.clientX - rect.left) / Math.max(1, rect.width);
    const y = 1 - (event.clientY - rect.top) / Math.max(1, rect.height);
    const aspect = rect.width / Math.max(1, rect.height);
    pointer.inside = x >= 0 && x <= 1 && y >= 0 && y <= 1;
    pointer.x = (x - 0.5) * aspect;
    pointer.y = y - 0.5;
  };

  const onPointerMove = (event) => {
    locate(event);
    if (!pointer.inside || !settings.mouseInteraction || reduce) return;
    const head = trail[0];
    const gap = head ? Math.hypot(pointer.x - head.x, pointer.y - head.y) : Infinity;
    if (gap < TRAIL_STEP) return;
    if (head && head.age < 0.1) {
      const steps = Math.min(6, Math.floor(gap / (TRAIL_STEP * 2)));
      for (let i = 1; i <= steps; i++) {
        const k = i / (steps + 1);
        trail.unshift({ x: head.x + (pointer.x - head.x) * k, y: head.y + (pointer.y - head.y) * k, age: 0 });
      }
    }
    trail.unshift({ x: pointer.x, y: pointer.y, age: 0 });
    trail.length = Math.min(trail.length, MAX_TRAIL);
    wake();
  };

  const onPointerDown = (event) => {
    locate(event);
    if (!pointer.inside || !settings.clickEffect || reduce) return;
    clicks.unshift({ x: pointer.x, y: pointer.y, age: 0 });
    if (clicks.length > MAX_CLICKS) clicks.pop();
    wake();
  };

  const onVisibility = () => {
    last = 0;
    wake();
  };

  const resizeObserver = new ResizeObserver(resize);
  resizeObserver.observe(container);
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  document.addEventListener('visibilitychange', onVisibility);
  resize();

  return {
    setLightMode: function(light) {
      settings.lightMode = Boolean(light);
      draw();
      wake();
    },
    destroy: function() {
      disposed = true;
      cancelAnimationFrame(raf);
      resizeObserver.disconnect();
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerdown', onPointerDown);
      document.removeEventListener('visibilitychange', onVisibility);
      [fieldTarget, haloA, haloB].forEach(target => {
        target.textures.forEach(tex => gl.deleteTexture(tex));
        gl.deleteFramebuffer(target.framebuffer);
      });
      if (atlas) gl.deleteTexture(atlas.texture);
      gl.deleteVertexArray(vao);
      [field, halo, blur, composite].forEach(item => gl.deleteProgram(item.program));
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    }
  };
}

/* ========== Initialize GradientASCII Background ========== */
try {
  const bgContainer = document.getElementById('gradientAsciiBg');
  const bgCanvas = document.getElementById('asciiCanvas');
  if (bgContainer && bgCanvas) {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const ascii = initGradientASCII(bgContainer, bgCanvas, {
      colors: ['#1e3fd8', '#f6f8ff', '#a5d8ff', '#38bdf8'],
      shape: 'horizon',
      characters: ' =+xX0S8#@',
      cellSize: 18,
      density: 0.8,
      glow: 0.25,
      speed: 0.85,
      flow: 0.5,
      lightMode: !isDark,
      mouseInteraction: true,
      clickEffect: 'wave'
    });

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        ascii.setLightMode(!e.matches);
      });
    }
  }
} catch (err) {
  console.warn('GradientASCII background initialization failed:', err);
}

})();
</script>
</body>
</html>
